<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio social preview artwork</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f6f3; color: #171717; font-family: "Outfit", sans-serif; }
      main { width: 1200px; height: 630px; padding: 64px 76px; display: flex; flex-direction: column; }
      header { display: flex; align-items: center; justify-content: space-between; }
      img { width: 76px; height: auto; }
      .label { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; }
      h1 { margin: 58px 0 12px; font-size: 80px; font-weight: 600; line-height: 1.08; letter-spacing: -3px; }
      .role { margin: 0; font-size: 36px; font-weight: 400; color: #65645f; }
      .accent { height: 6px; width: 72px; margin-top: 32px; background: #eabd2b; border-radius: 3px; }
      footer { margin-top: auto; padding-top: 24px; border-top: 1px solid #dcdad4; display: flex; justify-content: space-between; font-size: 21px; }
      .specialties { color: #65645f; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="../assets/OscasaviaLogo.png" alt="Oscasavia logo" />
        <span class="label">Portfolio</span>
      </header>
      <h1>Oscasavia Birungi</h1>
      <p class="role">Software Engineer</p>
      <div class="accent"></div>
      <footer>
        <span class="specialties">Web · Mobile · Developer Experience</span>
        <span>oscasavia.netlify.app</span>
      </footer>
    </main>
  </body>
</html>
